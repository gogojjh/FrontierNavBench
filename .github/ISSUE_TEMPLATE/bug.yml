name: Bug report
description: Report a reproducible problem with setup, evaluation or reports.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python version, OS, and backend. Include GPU and Isaac versions if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, expected behavior and actual result. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification output
      description: Include relevant output from bash scripts/verify.sh or scripts/check_install.py.
