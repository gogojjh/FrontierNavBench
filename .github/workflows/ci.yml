name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup/requirements-evaluation.txt
      - name: Install evaluation and developer dependencies
        run: |
          python -m pip install 'pip<25.1' 'setuptools>=61,<75' wheel
          python -m pip install -r setup/requirements-evaluation.txt
          python -m pip install --no-build-isolation -e '.[evaluation,dev]'
      - name: Lint, regression tests and CPU smoke
        run: bash scripts/verify.sh
